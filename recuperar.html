<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar Faculdade</title><style>body{background:#061a33;color:#fff;font:16px system-ui;margin:0;display:grid;place-items:center;min-height:100vh;padding:20px}.box{max-width:420px;background:#102a4d;padding:24px;border-radius:18px}button{background:#ffd52e;color:#091a33;padding:13px;border:0;border-radius:12px;font-weight:bold;width:100%}p{line-height:1.6}</style></head><body><main class="box"><h1>Recuperar Faculdade</h1><p>Esta recuperação atualiza os arquivos do aplicativo sem apagar suas respostas, favoritos ou redações salvos neste navegador.</p><button id="go">Corrigir e abrir Faculdade</button><p id="status" role="status"></p></main><script>document.getElementById('go').onclick=async()=>{const status=document.getElementById('status');status.textContent='Atualizando arquivos...';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs){if(reg.scope.startsWith(new URL('./',location.href).href))await reg.unregister()}}if('caches'in window){const keys=await caches.keys();for(const key of keys){if(key.startsWith('faculdade-'))await caches.delete(key)}}status.textContent='Arquivos atualizados. Abrindo...';location.replace('./index.html?recuperado='+Date.now())}catch(e){status.textContent='Não foi possível concluir automaticamente. Reabra esta página no Chrome e tente novamente.'}}</script></body></html>
